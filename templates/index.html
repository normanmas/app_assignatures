{% extends "base.html" %}

{% block title %}Tria l'assignatura{% endblock %}

{% block content %}
    <section class="targeta">
        <h2>Benvingut</h2>
        <p>Aquesta aplicació ajuda a consultar i comparar assignatures.</p>
        
        <!-- Barra de cerca ràpida -->
        <form method="get" action="{{ url_for('cercar_assignatures') }}" class="barra-cerca">
            <input type="text" name="q" placeholder="Buscar assignatures..." required>
            <button type="submit">Buscar</button>
        </form>
        
        <div style="margin: 16px 0;"></div>
        
        <a class="boto" href="{{ url_for('veure_assignatures') }}">Veure assignatures</a>
        <a class="boto" href="{{ url_for('importar_assignatures') }}">Importar assignatures UOC</a>
        <a class="boto" href="{{ url_for('veure_aprovades') }}">Assignatures aprovades</a>
        <a class="boto" href="{{ url_for('veure_interessants') }}">Assignatures interessants</a>
        <a class="boto" href="{{ url_for('esborrar_cache_ruta') }}">Esborrar cache</a>
    </section>
{% endblock %}
